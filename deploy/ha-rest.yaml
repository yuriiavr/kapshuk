# Сенсори Капшука в Home Assistant: <config>/rest/kapshuk.yaml (rest: !include_dir_merge_list rest/),
# застосувати — служба rest.reload. Капшук віддає їх лише на 127.0.0.1, тобто тільки HA на цьому ж ноутбуці.
- resource: http://127.0.0.1:8793/sensors
  scan_interval: 300
  sensor:
    - name: "Капшук: витрачено за місяць"
      unique_id: kapshuk_spent
      value_template: "{{ value_json.spent }}"
      unit_of_measurement: "UAH"
      device_class: monetary
      icon: mdi:cart-outline
      json_attributes: [income, saved, top_categories, month]
    - name: "Капшук: платежі ще сплатити"
      unique_id: kapshuk_payments_unpaid
      value_template: "{{ value_json.payments_unpaid_sum }}"
      unit_of_measurement: "UAH"
      device_class: monetary
      icon: mdi:home-city-outline
      json_attributes: [payments_unpaid, payments_unpaid_titles, planned_left, month]
    - name: "Капшук: у банках"
      unique_id: kapshuk_jars_total
      value_template: "{{ value_json.jars_total }}"
      unit_of_measurement: "UAH"
      device_class: monetary
      icon: mdi:safe
